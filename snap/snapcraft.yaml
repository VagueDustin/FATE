# Snap Store recipe (Ubuntu App Center). Built by .github/workflows/build-linux.yml with
# snapcore/action-build from the electron-builder `linux-unpacked` output, then published to the
# stable channel by snapcore/action-publish when the SNAPCRAFT_STORE_CREDENTIALS secret exists.
#
# `version` is a placeholder the workflow replaces with package.json's version. snap/gui/ (desktop
# entry + icon) is generated by scripts/write-snap-desktop.mjs from package.json and build/icons.
#
# Conventions follow electron-builder's own core24 snap template: the gnome extension supplies
# GTK and the desktop integration, browser-support + --no-sandbox is how Chromium runs under
# strict confinement, TMPDIR must live inside the snap's own runtime dir. snapd owns updates, so
# the app's electron-updater stays off when $SNAP is set (see electron/main.cjs).
name: fate
title: FATE (Formatted Article & Text Editor)
base: core24
version: '0.0.0'
summary: Text and code editor with live Markdown preview
description: |
  FATE (Formatted Article & Text Editor) is a free and open source text and code editor, in the
  spirit of Notepad++. Any text file opens: code, configuration files, logs, scripts and files
  with no extension at all. The CodeMirror editor has syntax highlighting for around 150
  languages, tabs, find and replace, multiple cursors and column selection, code folding, split
  view and diffs. Files changed on disk reload in place, and never over unsaved edits.

  It is also a Markdown editor and viewer: KaTeX mathematics, Mermaid diagrams, highlighted code
  fences and a live table of contents, with an edit mode that puts the source beside a live
  preview. A repair layer fixes badly escaped LaTeX before it reaches the screen.

  You also get eight themes plus a theme builder, a bundled font library, a command palette,
  rebindable shortcuts, print to PDF with a real preview and session restore. It works fully
  offline, with no telemetry and no network requests.
license: AGPL-3.0-only
website: https://github.com/VagueDustin/FATE
source-code: https://github.com/VagueDustin/FATE
issues: https://github.com/VagueDustin/FATE/issues
grade: stable
confinement: strict

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

apps:
  fate:
    command: fate/FATE --no-sandbox
    extensions: [gnome]
    plugs:
      - browser-support
      - home
      # Declared, but NOT connected on install: the Snap Store only auto-connects removable-media
      # once it has granted this snap an assertion (a store-requests post on forum.snapcraft.io).
      # Until then users run `sudo snap connect fate:removable-media` once, and FATE tells them
      # so (electron/fsAccess.cjs) when a path under /media, /run/media or /mnt is denied, instead
      # of dropping the file silently as 1.13.2 did.
      - removable-media
    environment:
      TMPDIR: $XDG_RUNTIME_DIR

parts:
  fate:
    plugin: dump
    # The workflow stages snap/ and dist-electron/linux-unpacked into a small snapbuild/ directory
    # and builds there, so snapcraft's LXD instance does not have to ingest the whole checkout
    # (node_modules and the other 500 MB of Linux packages). Hence a sibling path, not
    # dist-electron/linux-unpacked.
    source: linux-unpacked
    organize:
      '*': fate/
    stage-packages:
      - libnspr4
      - libnss3
      - libxss1
      - libappindicator3-1
      - libsecret-1-0
