# Snap Store recipe (Ubuntu App Center). Built by .github/workflows/build-linux.yml with
# snapcore/action-build from the electron-builder `linux-unpacked` output, then published to the
# stable channel by snapcore/action-publish when the SNAPCRAFT_STORE_CREDENTIALS secret exists.
#
# `version` is a placeholder the workflow replaces with package.json's version. snap/gui/ (desktop
# entry + icon) is generated by scripts/write-snap-desktop.mjs from package.json and build/icons.
#
# Conventions follow electron-builder's own core24 snap template: the gnome extension supplies
# GTK and the desktop integration, browser-support + --no-sandbox is how Chromium runs under
# strict confinement, TMPDIR must live inside the snap's own runtime dir. snapd owns updates, so
# the app's electron-updater stays off when $SNAP is set (see electron/main.cjs).
name: fate
title: FATE - Formatted Article & Text Editor
base: core24
version: '0.0.0'
summary: Markdown viewer and text editor for technical documents
description: |
  FATE (Formatted Article and Text Editor) renders Markdown the way technical documents need:
  KaTeX mathematics, Mermaid diagrams, syntax-highlighted code fences and a live table of
  contents, with a repair layer that heals badly escaped LaTeX before it reaches the screen.

  It is also a full text editor. Any text file opens - code, configuration files, logs,
  scripts, extensionless files - in a CodeMirror editor with highlighting for around 150
  languages, code folding, multiple cursors, search and replace, split view and diffs.

  Eight themes plus a theme builder, a bundled font library, print to PDF with a real preview,
  tabs with session restore. Fully offline: no telemetry, no network requests.
license: AGPL-3.0-only
website: https://github.com/VagueDustin/FATE
source-code: https://github.com/VagueDustin/FATE
issues: https://github.com/VagueDustin/FATE/issues
grade: stable
confinement: strict

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

apps:
  fate:
    command: fate/FATE --no-sandbox
    extensions: [gnome]
    plugs:
      - browser-support
      - home
      - removable-media
    environment:
      TMPDIR: $XDG_RUNTIME_DIR

parts:
  fate:
    plugin: dump
    # The workflow stages snap/ and dist-electron/linux-unpacked into a small snapbuild/ directory
    # and builds there, so snapcraft's LXD instance does not have to ingest the whole checkout
    # (node_modules and the other 500 MB of Linux packages). Hence a sibling path, not
    # dist-electron/linux-unpacked.
    source: linux-unpacked
    organize:
      '*': fate/
    stage-packages:
      - libnspr4
      - libnss3
      - libxss1
      - libappindicator3-1
      - libsecret-1-0
