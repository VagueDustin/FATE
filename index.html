<!doctype html>
<html lang="en" data-theme="fate">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No webfont CDN. Cinzel and Inter are bundled locally via @fontsource and imported in
      src/main.jsx. FATE is a fully offline app with a no-telemetry posture (see PRIVACY.md), so
      reaching fonts.googleapis.com on every launch would both break offline use and make a network
      request the privacy policy says the app does not make.

      `data-theme` is set here as well as by React so the first paint is already navy — otherwise
      there is a flash of unstyled content before the store round-trip resolves.
    -->
    <title>FATE - Markdown Viewer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
