# Windows release build. One tag push does this, alongside build-linux.yml:
#
#   build      the NSIS installer (FATE-Setup-X.Y.Z.exe + latest.yml) and the Microsoft Store .appx
#   attach     the installer and latest.yml to the GitHub release for the tag; electron-updater on
#              Windows reads latest.yml from the latest release, so this is what existing installs
#              update from
#   artifact   all three on the run, the .appx for the Store submission (Partner Center)
#
# The maintainer's part is
#     gh release create vX.Y.Z --title ... --notes ...
# which creates the tag and fires this and build-linux.yml. Until the installer is attached (about
# ten minutes), update checks on Windows report that latest.yml is missing and succeed on the next
# check; the AppImage has always had the same gap for latest-linux.yml.
#
# A release that already carries FATE-Setup-X.Y.Z.exe and latest.yml (built locally and passed to
# `gh release create`, the old way) is left alone: replacing a live installer under a running
# update check would hand out a latest.yml whose hash matches neither file for a moment.
#
# The tag must be v + package.json's version, or the installer would be named for a different
# release than the one it is attached to; the job stops before uploading anything if they differ.
#
# "Run workflow" (workflow_dispatch) on a branch builds everything and attaches it to the run.
# Give it a `release_tag` to ALSO attach the installer to that existing release: the recovery path
# when a tag's own run failed.
name: Build Windows

on:
  push:
    tags: ['v*']
  # A change to this workflow builds on its own PR (artifacts only), since Run workflow is only
  # offered once a workflow is on the default branch.
  pull_request:
    paths: ['.github/workflows/build-windows.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach the installer to (empty = run artifacts only)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Release metadata
        id: meta
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG=""
          case "$GITHUB_REF" in refs/tags/*) TAG="$GITHUB_REF_NAME" ;; esac
          if [ -n "$RELEASE_TAG_INPUT" ]; then TAG="$RELEASE_TAG_INPUT"; fi
          if [ -n "$TAG" ] && [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json's version $VERSION. Bump the version before tagging."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version $VERSION: publishing to release: ${TAG:-no (artifacts only)}"

      - run: npm ci
      - run: npm run icons
      - run: npm run lint

      # Targets come from package.json: nsis and appx. Neither is code-signed (the Store signs the
      # .appx on submission), the same as the installers built locally before this workflow.
      - name: Build the installer and the Store package
        run: npm run electron:build -- --publish never

      - name: Check the build
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          ls -la dist-electron/*.exe dist-electron/*.appx dist-electron/latest.yml
          test -f "dist-electron/FATE-Setup-$VERSION.exe"
          tr -d '\r' < dist-electron/latest.yml > latest.check
          cat latest.check
          grep -qx "version: $VERSION" latest.check
          grep -qx "path: FATE-Setup-$VERSION.exe" latest.check

      - uses: actions/upload-artifact@v4
        with:
          # Not github.ref_name: on a PR that is "N/merge", and artifact names cannot contain "/".
          name: FATE-windows-${{ steps.meta.outputs.version }}-run${{ github.run_number }}
          if-no-files-found: error
          path: |
            dist-electron/FATE-Setup-*.exe
            dist-electron/latest.yml
            dist-electron/*.appx

      # ── Release ────────────────────────────────────────────────────────────────────────────
      - name: Attach the installer to the GitHub release
        if: steps.meta.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.release_tag }}
          EXE: FATE-Setup-${{ steps.meta.outputs.version }}.exe
        run: |
          set -euo pipefail
          # No draft is created here: build-linux.yml creates one when a bare tag is pushed, and two
          # jobs racing to create it would leave two drafts for the same tag.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::No release for $TAG. Create it with gh release create, then re-run this job or Run workflow with release_tag=$TAG."
            exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > assets.txt
          if grep -qx "$EXE" assets.txt && grep -qx latest.yml assets.txt; then
            echo "::notice::$TAG already has $EXE and latest.yml; leaving them in place."
            exit 0
          fi
          # Installer first, then latest.yml: electron-updater follows latest.yml, so it must never
          # name an installer that is not there yet.
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "dist-electron/$EXE"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist-electron/latest.yml
          echo "Release assets now:"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
