# Linux release pipeline. One tag push does all of this:
#
#   build       AppImage, .deb (Ubuntu/Debian), .rpm (Fedora/RHEL) and the snap's staging tree.
#               NO secrets: this job runs `npm ci` (every dependency's install scripts) and
#               electron-builder's tool downloads.
#   snap        builds the .snap with snapcore/action-build. No secrets either.
#   publish     signs the .rpm, attaches everything + latest-linux.yml to the GitHub release, and
#               republishes the signed apt and dnf repositories. The ONLY job that sees the signing
#               key, and it runs no npm and no third-party action: system tools, gpg and gh.
#   snap-store  uploads the snap to the Snap Store stable channel (when SNAPCRAFT_STORE_CREDENTIALS
#               is set). Its only secret is that store token.
#   test-repos  installs `fate` from the apt repo in a Debian container and from the dnf repo in a
#               Fedora container, exactly as a user would.
#   flatpak     builds + lints the Flathub manifest against the released .deb (Flathub itself is
#               updated by flatpak-external-data-checker from the release; nothing to do here).
#
# The maintainer's part is
#     gh release create vX.Y.Z --title ... --notes ...
# which creates the tag and fires this and build-windows.yml (the Windows installer and latest.yml).
#
# ── Guards: what gets published where ──────────────────────────────────────────────────────────
#   * The tag must be v + package.json's version (the same check as build-windows.yml), or a tag
#     without a version bump would republish the old build under the new name. Checked before
#     anything is built.
#   * A recovery run (Run workflow with release_tag) builds THAT TAG's commit, not the branch the
#     run was started from.
#   * apt, dnf and the Snap Store are stable channels. They are updated only when the release is
#     published (not a draft: draft assets 404 for everyone), is not a prerelease (and the tag has
#     no "-": v1.15.0-beta.1 never goes there), and is the repository's latest release (so a
#     recovery run for an older tag cannot roll the repositories back). A release that fails these
#     still gets its files; the job says which rule held it back.
#   * Assets already on the release are kept: a re-run would replace them with new bytes and new
#     hashes, which breaks the AUR's and Flathub's checksums. The AppImage, .deb, .rpm and
#     latest-linux.yml are one unit (latest-linux.yml carries their hashes): all are uploaded, or
#     none. A release holding only some of them stops the job; Run workflow with force replaces
#     them all. The apt and dnf indexes are built from the packages ON the release, never from
#     this run's rebuild, so they always describe the bytes users download.
#   * Publishing jobs of different runs never overlap (one fixed concurrency group).
#
# ── How the apt/dnf repositories live entirely in GitHub Releases ─────────────────────────────
# Both package managers need an index, a signature, and the packages. The packages are the
# versioned release assets already. The indexes go to two ROLLING releases whose tags are chosen
# so the URLs line up:
#
#   apt   flat repo:  deb https://github.com/OWNER/REPO/releases/download/  apt/
#         apt fetches <base>/apt/InRelease and <base>/apt/Packages; `Filename:` entries are
#         relative to <base>, i.e. `vX.Y.Z/FATE-X.Y.Z-amd64.deb`, the release asset itself.
#   dnf   baseurl=https://github.com/OWNER/REPO/releases/download/
#         dnf fetches <baseurl>/repodata/repomd.xml, so the rolling tag is literally `repodata`;
#         createrepo_c --baseurl stamps each package location with the versioned release URL.
#
# BOTH rolling releases are created as PRERELEASES and never marked latest. This is not
# cosmetic: electron-updater resolves "latest" through GitHub's /releases/latest, which returns
# the newest non-prerelease. A normal `apt` release would hijack every Windows and AppImage
# install's update check. Keep them prereleases forever.
#
# ── Signing ────────────────────────────────────────────────────────────────────────────────────
# The FATE_GPG_PRIVATE_KEY secret (created once by scripts/setup-signing-key.sh) signs the .rpm,
# the apt index (InRelease, Release.gpg) and the dnf repodata (repomd.xml.asc). The PUBLIC keyring
# is committed: build/linux/fate-archive-keyring.{gpg,asc}. The packages ship it, the post-install
# scripts (build/linux/after-install-*.sh) register the repositories with it, and it is uploaded
# beside the indexes. SIGNING_KEYS below names the allowed signing keys by fingerprint; publish
# refuses to sign unless the secret holds exactly those keys and the committed keyring has every
# one of them (npm test checks the keyring side on every PR). Changing it is a key rotation:
# SECURITY.md → Package signing key.
#
# "Run workflow" (workflow_dispatch) on a branch builds everything and attaches it to the run;
# the .rpm on the run is unsigned (only release runs touch the key). Give it a `release_tag` to
# publish that existing release: the recovery path when a tag's own run failed.
name: Build Linux

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to publish, e.g. v1.14.0 (empty = build only; the packages stay on the run)'
        required: false
        default: ''
        type: string
      force:
        description: 'Replace Linux assets already on that release (their hashes change: the AUR and Flathub checksums break)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO_BASE: https://github.com/${{ github.repository }}/releases/download
  # The key(s) allowed to sign, by full fingerprint, space-separated. All of them sign the apt and
  # dnf indexes; the first also signs the .rpm (an rpm carries one signature). One key normally;
  # two only during a key rotation (SECURITY.md → Package signing key).
  SIGNING_KEYS: 5E78FD802EB3DDCCAB6F10268B2F82F6B2F71B42

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.target.outputs.release_tag }}
      artifact: ${{ steps.meta.outputs.artifact }}
    steps:
      # Inputs reach scripts only through env, never pasted into the script text.
      - name: Resolve the release tag
        id: target
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG=""
          case "$GITHUB_REF" in refs/tags/*) TAG="$GITHUB_REF_NAME" ;; esac
          if [ -n "$RELEASE_TAG_INPUT" ]; then TAG="$RELEASE_TAG_INPUT"; fi
          REF=""
          if [ -n "$TAG" ]; then
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::The release tag must look like v1.2.3 or v1.2.3-beta.1."
              exit 1
            fi
            # Build the tagged commit, also when Run workflow was started from a branch.
            REF="refs/tags/$TAG"
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.target.outputs.ref }}
          persist-credentials: false

      # TODO(pin): replace @v4 with the full commit SHA: gh api repos/actions/setup-node/commits/v4 --jq .sha
      - uses: actions/setup-node@v4 # v4
        with:
          node-version: 22
          cache: npm

      - name: Release metadata
        id: meta
        env:
          TAG: ${{ steps.target.outputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ -n "$TAG" ] && [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json's version $VERSION. Bump the version before tagging."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Not github.ref_name: a branch like fix/x would put "/" in the name, which artifacts refuse.
          echo "artifact=FATE-linux-$VERSION-run$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "version $VERSION: publishing to release: ${TAG:-no (artifacts only)}"

      # rpm: rpmbuild for the Fedora package, and rpm -q to inspect it.
      # appstream + desktop-file-utils: validators for the desktop integration.
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm appstream desktop-file-utils

      - name: Validate the AppStream metadata
        run: appstreamcli validate --no-net --explain build/com.vaguedustin.fate.metainfo.xml

      - run: npm ci
      - run: npm run icons
      - run: npm run lint
      - run: npm test

      - name: Build AppImage, .deb and .rpm
        run: npm run electron:build:linux -- --publish never

      - name: Check the packages and their desktop integration
        run: |
          set -euo pipefail
          ls -la dist-electron/*.AppImage dist-electron/*.deb dist-electron/*.rpm dist-electron/latest-linux.yml
          echo "--- rpm metadata"
          rpm -qip dist-electron/*.rpm
          echo "--- rpm dependencies"
          rpm -qpR dist-electron/*.rpm
          echo "--- deb metadata"
          dpkg-deb --info dist-electron/*.deb

          # Listings go to files first: `cmd | grep -q` closes the pipe on the first match, the
          # producer dies with a write error, and pipefail fails the step even though it matched.
          dpkg-deb --contents dist-electron/*.deb | awk '{print $6}' > /tmp/deb-files.txt
          rpm -qpl dist-electron/*.rpm > /tmp/rpm-files.txt 2>/dev/null
          rpm -qp --scripts dist-electron/*.rpm > /tmp/rpm-scripts.txt 2>/dev/null
          echo "--- deb: files outside /opt"
          grep -v '^\./opt/' /tmp/deb-files.txt | grep -v '/$'
          echo "--- rpm: files outside /opt"
          grep -v '^/opt/' /tmp/rpm-files.txt | grep -v '/\.build-id/'
          grep -q '^/usr/share/metainfo/com.vaguedustin.fate.metainfo.xml$' /tmp/rpm-files.txt
          grep -q '^/usr/share/applications/FATE.desktop$' /tmp/rpm-files.txt
          grep -q '^/etc/pki/rpm-gpg/RPM-GPG-KEY-fate$' /tmp/rpm-files.txt
          grep -q 'usr/share/keyrings/fate-archive-keyring.gpg' /tmp/deb-files.txt

          echo "--- maintainer scripts: post-install registers the repositories, remove takes them out"
          rm -rf /tmp/debctl && mkdir -p /tmp/debctl && dpkg-deb -e dist-electron/*.deb /tmp/debctl
          grep -q 'sources.list.d/fate.sources' /tmp/debctl/postinst
          grep -q 'sources.list.d/fate.sources' /tmp/debctl/postrm
          grep -q 'yum.repos.d/fate.repo' /tmp/rpm-scripts.txt
          # The rpm's post-uninstall must sit out upgrades; posttrans repairs what older ones broke.
          sed -n '/^postuninstall scriptlet/,/^[a-z]* scriptlet/p' /tmp/rpm-scripts.txt > /tmp/rpm-postun.txt
          grep -q '"$1" -ge 1' /tmp/rpm-postun.txt
          grep -q '^posttrans scriptlet' /tmp/rpm-scripts.txt

          echo "--- desktop entry"
          rm -rf /tmp/deb && mkdir -p /tmp/deb && dpkg-deb -x dist-electron/*.deb /tmp/deb
          desktop-file-validate /tmp/deb/usr/share/applications/FATE.desktop
          cat /tmp/deb/usr/share/applications/FATE.desktop
          echo "--- MIME types declared: $(grep '^MimeType=' /tmp/deb/usr/share/applications/FATE.desktop | tr ';' '\n' | grep -c /)"

          echo "--- the keyring the packages ship is the committed one"
          cmp /tmp/deb/usr/share/keyrings/fate-archive-keyring.gpg build/linux/fate-archive-keyring.gpg

          # app.asar holds the renderer bundle and the main process's two runtime packages, about
          # 15 MB. Up to 1.13 it was 211 MB: every renderer package shipped a second time as
          # node_modules because they sat in "dependencies". Renderer packages belong in
          # devDependencies (Vite bundles them).
          ASAR_BYTES="$(stat -c %s dist-electron/linux-unpacked/resources/app.asar)"
          echo "--- app.asar: $((ASAR_BYTES / 1048576)) MB"
          if [ "$ASAR_BYTES" -gt $((50 * 1048576)) ]; then
            echo "::error::app.asar is $((ASAR_BYTES / 1048576)) MB. A renderer package is probably in package.json's dependencies instead of devDependencies."
            exit 1
          fi

      - name: Stage the snap build
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/write-snap-desktop.mjs
          rm -rf snapbuild && mkdir -p snapbuild
          cp -r snap snapbuild/snap
          cp -r dist-electron/linux-unpacked snapbuild/linux-unpacked
          sed -i "s|^version: .*|version: '$VERSION'|" snapbuild/snap/snapcraft.yaml
          grep '^version:' snapbuild/snap/snapcraft.yaml
          # Artifacts drop file modes; the tarball keeps FATE and its helpers executable.
          tar -cf snapbuild.tar snapbuild

      # TODO(pin): replace @v4 with the full commit SHA: gh api repos/actions/upload-artifact/commits/v4 --jq .sha
      - uses: actions/upload-artifact@v4 # v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          if-no-files-found: error
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.rpm
            dist-electron/latest-linux.yml

      - uses: actions/upload-artifact@v4 # v4 (TODO(pin), as above)
        with:
          name: snapbuild
          if-no-files-found: error
          # Only the snap job reads it; a week still covers re-running that job.
          retention-days: 7
          path: snapbuild.tar

  # ── Snap: build only. No secrets here; snap-store below does the upload. ───────────────────
  snap:
    name: Build the snap
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: snapbuild

      - run: tar -xf snapbuild.tar

      - name: Build the snap
        id: snap
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
        with:
          path: snapbuild

      - name: Inspect the snap
        id: name
        env:
          SNAP_FILE: ${{ steps.snap.outputs.snap }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          ls -la "$SNAP_FILE"
          echo "artifact=FATE-snap-$VERSION-run$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4 # v4 (TODO(pin), as above)
        with:
          name: ${{ steps.name.outputs.artifact }}
          if-no-files-found: error
          path: ${{ steps.snap.outputs.snap }}

  # ── Sign and publish: the only job with the signing key. No npm, no third-party actions. ────
  publish:
    name: Sign and publish
    needs: [build, snap]
    if: needs.build.outputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # One fixed group: a tag run and a recovery run never publish at the same time. (GitHub keeps
    # one run waiting per group; a third arriving meanwhile cancels the waiting one.)
    concurrency:
      group: build-linux-publish
      cancel-in-progress: false
    outputs:
      stable: ${{ steps.release.outputs.stable }}
      deb_sha256: ${{ steps.published.outputs.deb_sha256 }}
    env:
      TAG: ${{ needs.build.outputs.release_tag }}
      VERSION: ${{ needs.build.outputs.version }}
      FORCE: ${{ inputs.force }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # For the committed public keyring, from the tag being published.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.build.outputs.release_tag }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.snap.outputs.artifact }}
          path: dist

      # rpm: rpmsign. createrepo-c: dnf repodata. dpkg-dev + apt-utils: the apt index
      # (dpkg-scanpackages, apt-ftparchive).
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm createrepo-c dpkg-dev apt-utils gnupg

      - name: Check the release
        id: release
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            echo "No release for $TAG yet; creating it as a draft."
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" \
              --notes "Linux packages built by GitHub Actions. The Windows installer and latest.yml are attached by Build Windows."
          fi
          DRAFT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          PRERELEASE="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
          LATEST="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
          SEMVER_PRERELEASE=false
          case "$TAG" in *-*) SEMVER_PRERELEASE=true ;; esac

          # A prerelease version on a release that is not marked prerelease would become the
          # latest release, and every installed copy would update to it.
          if [ "$SEMVER_PRERELEASE" = true ] && [ "$PRERELEASE" != true ]; then
            echo "::error::$TAG is a prerelease version, but its GitHub release is not marked as a prerelease. Mark it (gh release edit $TAG --prerelease), then re-run this job."
            exit 1
          fi

          STABLE=false
          if [ "$DRAFT" = true ]; then
            echo "::notice::$TAG is a draft: apt, dnf and the Snap Store are not updated (draft assets are not downloadable)."
          elif [ "$PRERELEASE" = true ] || [ "$SEMVER_PRERELEASE" = true ]; then
            echo "::notice::$TAG is a prerelease: its files are attached; apt, dnf and the Snap Store stay on the stable release."
          elif [ "$LATEST" != "$TAG" ]; then
            echo "::notice::$TAG is not the latest release (${LATEST:-none}): apt, dnf and the Snap Store are left alone."
          else
            STABLE=true
          fi
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT prerelease=$PRERELEASE latest=${LATEST:-none} -> stable channels: $STABLE"

      - name: Decide what to upload
        id: plan
        run: |
          set -euo pipefail
          shopt -s nullglob
          for pattern in '*.AppImage' '*.deb' '*.rpm' '*.snap'; do
            # shellcheck disable=SC2206 # the pattern is meant to glob
            files=(dist/$pattern)
            if [ "${#files[@]}" -ne 1 ]; then
              echo "::error::Expected one dist/$pattern from the build, found ${#files[@]}."
              exit 1
            fi
          done
          if [ ! -f dist/latest-linux.yml ]; then
            echo "::error::dist/latest-linux.yml is missing from the build."
            exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > existing.txt
          have() { grep -qxF "$1" existing.txt; }

          # latest-linux.yml carries the sha512 of the AppImage, .deb and .rpm, so the four go up
          # together or not at all.
          UNIT=()
          for f in dist/*.AppImage dist/*.deb dist/*.rpm dist/latest-linux.yml; do UNIT+=("$(basename "$f")"); done
          present=0
          for name in "${UNIT[@]}"; do if have "$name"; then present=$((present + 1)); fi; done
          if [ "$FORCE" = true ]; then
            unit=replace
          elif [ "$present" -eq 0 ]; then
            unit=upload
          elif [ "$present" -eq "${#UNIT[@]}" ]; then
            unit=keep
            echo "::notice::$TAG already has ${UNIT[*]}; leaving them in place (Run workflow with force to replace them)."
          else
            echo "::error::$TAG has only some of ${UNIT[*]}. This build's bytes differ from the ones there, and latest-linux.yml must match all of them. Run workflow with release_tag=$TAG and force to replace them all."
            exit 1
          fi

          snap=upload
          SNAP_NAME="$(basename dist/*.snap)"
          if [ "$FORCE" = true ]; then snap=replace; elif have "$SNAP_NAME"; then snap=keep; fi
          echo "unit=$unit" >> "$GITHUB_OUTPUT"
          echo "snap=$snap" >> "$GITHUB_OUTPUT"
          echo "packages: $unit, snap: $snap"

      - name: Import the signing key and check it is the expected one
        env:
          FATE_GPG_PRIVATE_KEY: ${{ secrets.FATE_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$FATE_GPG_PRIVATE_KEY" ]; then
            echo "::error::The FATE_GPG_PRIVATE_KEY repository secret is missing. Run scripts/setup-signing-key.sh once (README → Building from source → Releases)."
            exit 1
          fi
          printf '%s\n' "$FATE_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          # Primary-key fingerprints: the fpr line straight after each sec/pub line.
          primaries() { awk -F: '$1 == "sec" || $1 == "pub" { want = 1; next } want && $1 == "fpr" { print $10; want = 0 }'; }
          read -ra KEYS <<< "$SIGNING_KEYS"
          HAVE="$(gpg --batch --list-secret-keys --with-colons | primaries | sort)"
          WANT="$(printf '%s\n' "${KEYS[@]}" | sort)"
          if [ "$HAVE" != "$WANT" ]; then
            echo "::error::FATE_GPG_PRIVATE_KEY holds $(tr '\n' ' ' <<< "$HAVE")but this workflow signs only with $SIGNING_KEYS. Nothing was signed. If the key was rotated on purpose, SIGNING_KEYS and build/linux/fate-archive-keyring.* change in the same commit (SECURITY.md → Package signing key)."
            exit 1
          fi
          SHIPPED="$(gpg --batch --show-keys --with-colons build/linux/fate-archive-keyring.asc | primaries)"
          for fpr in "${KEYS[@]}"; do
            if ! grep -qx "$fpr" <<< "$SHIPPED"; then
              echo "::error::Signing key $fpr is not in build/linux/fate-archive-keyring.asc, so installs would not trust what it signs."
              exit 1
            fi
          done
          echo "PRIMARY_KEY=${KEYS[0]}" >> "$GITHUB_ENV"
          echo "Signing with: $SIGNING_KEYS"

      - name: Sign the rpm
        if: steps.plan.outputs.unit != 'keep'
        run: |
          set -euo pipefail
          RPM="$(ls dist/*.rpm)"
          rpmsign --define "_gpg_name $PRIMARY_KEY" --addsign "$RPM"
          # Verify the way dnf will: import the public key into an rpm database and let rpm check
          # the signature, in a PRIVATE database (--dbpath), because a `sudo rpm --import` lands
          # in root's database and the unprivileged `rpm -K` that follows cannot see it (NOKEY).
          # (Querying %{SIGPGP} is wrong here too: rpm 4.14+ writes a V4 header signature into
          # RSAHEADER, and SIGPGP reads back as "(none)".)
          RPMDB="$PWD/rpmdb-verify"
          rm -rf "$RPMDB" && mkdir -p "$RPMDB"
          rpm --dbpath "$RPMDB" --initdb
          rpm --dbpath "$RPMDB" --import build/linux/fate-archive-keyring.asc
          echo "--- signature on the rpm:"
          rpm --dbpath "$RPMDB" -qip "$RPM" | grep '^Signature'
          rpm --dbpath "$RPMDB" -K "$RPM" > rpm-K.txt
          cat rpm-K.txt
          grep -q 'signatures OK' rpm-K.txt

          # electron-builder listed the rpm in latest-linux.yml with the sha512 and size of the
          # UNSIGNED file. Signing rewrote it, so restate both, or an update that follows
          # latest-linux.yml to the rpm would fail its checksum.
          NAME="$(basename "$RPM")"
          if grep -qxF "  - url: $NAME" dist/latest-linux.yml; then
            SHA512="$(openssl dgst -sha512 -binary "$RPM" | base64 -w0)"
            SIZE="$(stat -c %s "$RPM")"
            awk -v name="$NAME" -v sha="$SHA512" -v size="$SIZE" '
              /^  - url: / { inrpm = ($3 == name) }
              /^[^ ]/ { inrpm = 0; top = top || ($1 == "path:" && $2 == name) }
              inrpm && /^    sha512: / { print "    sha512: " sha; n++; next }
              inrpm && /^    size: / { print "    size: " size; n++; next }
              top && /^sha512: / { print "sha512: " sha; next }
              { print }
              END { if (n != 2) exit 3 }
            ' dist/latest-linux.yml > latest-linux.yml.new
            mv latest-linux.yml.new dist/latest-linux.yml
            grep -qxF "    sha512: $SHA512" dist/latest-linux.yml
            echo "--- latest-linux.yml"; cat dist/latest-linux.yml
          fi

      # Binaries first, latest-linux.yml LAST: the AppImage updater follows latest-linux.yml and
      # must never be sent to a file that is not there yet.
      - name: Attach the packages to the release
        env:
          UNIT: ${{ steps.plan.outputs.unit }}
          SNAP: ${{ steps.plan.outputs.snap }}
        run: |
          set -euo pipefail
          upload() {  # mode files...
            local mode="$1"; shift
            if [ "$mode" = replace ]; then
              gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$@"
            else
              gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$@"
            fi
          }
          if [ "$UNIT" != keep ]; then
            upload "$UNIT" dist/*.AppImage dist/*.deb dist/*.rpm
          fi
          if [ "$SNAP" != keep ]; then
            upload "$SNAP" dist/*.snap
          fi
          if [ "$UNIT" != keep ]; then
            upload "$UNIT" dist/latest-linux.yml
          fi
          echo "Release assets now:"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'

      - name: Stop at a draft
        if: steps.release.outputs.draft == 'true'
        run: |
          echo "::error::$TAG is a draft. Its files are attached, but apt, dnf, the Snap Store and the Flatpak check did not run: their indexes would point at draft assets, which nobody can download. Publish the release, then re-run this job (or Run workflow with release_tag=$TAG)."
          exit 1

      # The indexes describe the files users actually download: the ones on the release, which a
      # kept unit means are not this run's rebuild.
      - name: Fetch the published packages
        id: published
        run: |
          set -euo pipefail
          rm -rf published && mkdir -p published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published \
            --pattern "$(basename dist/*.deb)" --pattern "$(basename dist/*.rpm)"
          ls -la published
          echo "deb_sha256=$(sha256sum published/*.deb | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish the apt repository
        if: steps.release.outputs.stable == 'true'
        run: |
          set -euo pipefail
          read -ra KEYS <<< "$SIGNING_KEYS"
          SIGN=()
          for fpr in "${KEYS[@]}"; do SIGN+=(--local-user "$fpr"); done
          rm -rf repo && mkdir -p repo/apt "repo/$TAG"
          cp published/*.deb "repo/$TAG/"
          # Filename: entries come out as ./vX.Y.Z/FATE-...deb; apt wants them relative to the
          # base URL, so drop the ./; the result is exactly the release asset URL.
          ( cd repo && dpkg-scanpackages --multiversion . /dev/null ) > repo/apt/Packages
          sed -i 's|^Filename: \./|Filename: |' repo/apt/Packages
          gzip -9 -k -f repo/apt/Packages
          ( cd repo/apt && apt-ftparchive \
              -o APT::FTPArchive::Release::Origin="VagueDustin Enterprises" \
              -o APT::FTPArchive::Release::Label="FATE" \
              -o APT::FTPArchive::Release::Suite="stable" \
              -o APT::FTPArchive::Release::Codename="stable" \
              -o APT::FTPArchive::Release::Architectures="amd64" \
              -o APT::FTPArchive::Release::Description="FATE - Formatted Article & Text Editor" \
              release . ) > repo/apt/Release
          # One signature per signing key: apt accepts the index when any of them is one it trusts.
          gpg --batch --yes --armor --detach-sign "${SIGN[@]}" -o repo/apt/Release.gpg repo/apt/Release
          gpg --batch --yes --clearsign "${SIGN[@]}" -o repo/apt/InRelease repo/apt/Release
          # The first line is also the marker the .deb's postrm looks for: removing the package
          # deletes this file when a user downloaded it (README), because the keyring it names
          # goes with the package. Keep it.
          cat > repo/apt/fate.sources <<EOF
          # FATE - Formatted Article & Text Editor: apt repository (served from GitHub Releases).
          # Keyring: $REPO_BASE/apt/fate-archive-keyring.gpg
          Types: deb
          URIs: $REPO_BASE/
          Suites: apt/
          Signed-By: /usr/share/keyrings/fate-archive-keyring.gpg
          EOF
          echo "--- Packages"; cat repo/apt/Packages

          if ! gh release view apt --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create apt --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "apt repository (index files, not a release)" \
              --notes "Index files for the FATE apt repository; the packages are the versioned releases. This is marked as a prerelease on purpose: it must never become the 'latest' release. To install: see the README, Linux → Ubuntu / Debian."
          fi
          gh release upload apt --repo "$GITHUB_REPOSITORY" --clobber \
            repo/apt/Release repo/apt/Release.gpg repo/apt/InRelease repo/apt/Packages repo/apt/Packages.gz \
            repo/apt/fate.sources build/linux/fate-archive-keyring.gpg build/linux/fate-archive-keyring.asc

      - name: Publish the dnf repository
        if: steps.release.outputs.stable == 'true'
        run: |
          set -euo pipefail
          read -ra KEYS <<< "$SIGNING_KEYS"
          SIGN=()
          for fpr in "${KEYS[@]}"; do SIGN+=(--local-user "$fpr"); done
          rm -rf repo/rpm && mkdir -p repo/rpm
          cp published/*.rpm repo/rpm/
          # The published rpm may come from an earlier run: check it carries a signature installs trust.
          rm -rf rpmdb-repo && mkdir -p rpmdb-repo
          rpm --dbpath "$PWD/rpmdb-repo" --initdb
          rpm --dbpath "$PWD/rpmdb-repo" --import build/linux/fate-archive-keyring.asc
          rpm --dbpath "$PWD/rpmdb-repo" -K repo/rpm/*.rpm > rpm-K-published.txt
          cat rpm-K-published.txt
          grep -q 'signatures OK' rpm-K-published.txt
          # --baseurl stamps each package <location> with the versioned release URL, so the
          # repodata can live under the rolling `repodata` tag while packages stay put.
          createrepo_c --simple-md-filenames --no-database --general-compress-type gz \
            --baseurl "$REPO_BASE/$TAG/" repo/rpm
          gpg --batch --yes --armor --detach-sign "${SIGN[@]}" -o repo/rpm/repodata/repomd.xml.asc repo/rpm/repodata/repomd.xml
          cat > repo/rpm/fate.repo <<EOF
          [fate]
          name=FATE - Formatted Article & Text Editor
          baseurl=$REPO_BASE/
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=$REPO_BASE/repodata/fate-archive-keyring.asc
          metadata_expire=6h
          EOF
          echo "--- repodata"; ls -la repo/rpm/repodata
          echo "--- package location (must point at the versioned release asset)"
          zcat repo/rpm/repodata/primary.xml.gz | grep -o '<location[^>]*>'

          if ! gh release view repodata --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create repodata --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "dnf repository (repodata, not a release)" \
              --notes "Repodata for the FATE dnf repository; the packages are the versioned releases. This is marked as a prerelease on purpose: it must never become the 'latest' release. To install: see the README, Linux → Fedora / RHEL."
          fi
          gh release upload repodata --repo "$GITHUB_REPOSITORY" --clobber \
            repo/rpm/repodata/* repo/rpm/fate.repo build/linux/fate-archive-keyring.asc

      - name: Remove the signing key from the runner
        if: always()
        run: |
          gpgconf --kill all || true
          rm -rf "$HOME/.gnupg"

  # ── Snap Store: the store token is this job's only secret ──────────────────────────────────
  snap-store:
    name: Publish to the Snap Store
    needs: [snap, publish]
    if: needs.publish.outputs.stable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_SNAP_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}
    steps:
      - name: Snap Store publishing skipped
        if: env.HAS_SNAP_CREDENTIALS != 'true'
        run: |
          echo "::notice::SNAPCRAFT_STORE_CREDENTIALS is not set; the snap was built and attached to the release but not uploaded to the Snap Store. See README → Building from source → Releases."

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: env.HAS_SNAP_CREDENTIALS == 'true'
        with:
          name: ${{ needs.snap.outputs.artifact }}
          path: snap-out

      - name: Locate the snap
        id: file
        if: env.HAS_SNAP_CREDENTIALS == 'true'
        run: |
          set -euo pipefail
          ls -la snap-out
          echo "snap=$(ls snap-out/*.snap)" >> "$GITHUB_OUTPUT"

      - name: Publish to the Snap Store (stable)
        if: env.HAS_SNAP_CREDENTIALS == 'true'
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.file.outputs.snap }}
          release: stable

  # ── Install tests: exactly what a user does ────────────────────────────────────────────────
  test-repos:
    name: Install from the repositories
    needs: [build, publish]
    if: needs.publish.outputs.stable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.build.outputs.release_tag }}
          persist-credentials: false

      - name: Test `apt install fate` in a Debian container
        run: |
          sleep 15
          docker run --rm -e REPO_BASE -v "$PWD/build/linux:/k:ro" debian:stable-slim bash -euxc '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends ca-certificates >/dev/null
            install -m644 /k/fate-archive-keyring.gpg /usr/share/keyrings/fate-archive-keyring.gpg
            printf "Types: deb\nURIs: %s/\nSuites: apt/\nSigned-By: /usr/share/keyrings/fate-archive-keyring.gpg\n" "$REPO_BASE" > /etc/apt/sources.list.d/fate.sources
            apt-get update -qq
            apt-get install -y -qq fate >/dev/null
            dpkg -s fate | grep "^Version"
            test -x "/opt/FATE - Formatted Article & Text Editor/FATE"
            test -f /etc/apt/sources.list.d/fate.sources
            grep -q Signed-By /etc/apt/sources.list.d/fate.sources
            echo "apt install fate: OK"'

      - name: Test `dnf install fate` in a Fedora container
        run: |
          docker run --rm -e REPO_BASE fedora:latest bash -euxc '
            curl -fsSL -o /etc/yum.repos.d/fate.repo "$REPO_BASE/repodata/fate.repo"
            dnf install -y fate >/dev/null
            rpm -q fate
            rpm -qi fate | grep "^Signature" | grep -v "(none)"
            test -x "/opt/FATE - Formatted Article & Text Editor/FATE"
            test -f /etc/yum.repos.d/fate.repo
            echo "dnf install fate: OK"'

  # ── Flatpak: prove the Flathub manifest builds against the released .deb ──────────────────
  flatpak:
    name: Flathub manifest
    needs: [build, publish]
    if: needs.publish.outputs.deb_sha256 != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.build.outputs.release_tag }}
          persist-credentials: false

      - name: Render the manifest for this release
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DEB_SHA256: ${{ needs.publish.outputs.deb_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p flatpak/rendered
          sed -e "s|@VERSION@|$VERSION|g" \
              -e "s|@DEB_SHA256@|$DEB_SHA256|g" \
              flatpak/com.vaguedustin.fate.yml > flatpak/rendered/com.vaguedustin.fate.yml
          cp flatpak/flathub.json flatpak/rendered/flathub.json
          grep -n "url:\|sha256:" flatpak/rendered/com.vaguedustin.fate.yml

      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: com.vaguedustin.fate.flatpak
          manifest-path: flatpak/rendered/com.vaguedustin.fate.yml
          cache: false
          upload-artifact: false

      # Flathub's own linter. Its errors fail the job, except these, which every build outside
      # Flathub reports or which Flathub settles at submission:
      #   finish-args-home-filesystem-access     FATE is a file editor; --filesystem=home is the
      #                                          point (manifest comment). Flathub grants it as an
      #                                          exception when the app is submitted.
      #   appstream-external-screenshot-url,     only Flathub's own build mirrors screenshots to
      #   appstream-screenshots-not-mirrored-in-ostree   dl.flathub.org.
      #   appid-url-not-reachable                the linter fetches https://vaguedustin.com, and
      #                                          the site's bot protection answers it with a 403.
      #                                          Domain ownership is verified at submission.
      # Anything else, including a linter that cannot run at all, is a real failure.
      - name: Lint the manifest and the built repo (Flathub's own checks)
        run: |
          set -euo pipefail
          flatpak install -y --noninteractive flathub org.flatpak.Builder
          ACCEPTED=' finish-args-home-filesystem-access appstream-external-screenshot-url appstream-screenshots-not-mirrored-in-ostree appid-url-not-reachable '
          failed=0
          for kind in manifest repo; do
            case "$kind" in
              manifest) target=flatpak/rendered/com.vaguedustin.fate.yml ;;
              repo) target=repo ;;
            esac
            status=0
            flatpak run --command=flatpak-builder-lint org.flatpak.Builder "$kind" "$target" > "lint-$kind.json" || status=$?
            cat "lint-$kind.json"
            if [ "$status" -eq 0 ]; then
              continue
            fi
            # The JSON report lists error ids one per line inside "errors": [ ... ].
            errors="$(sed -n '/"errors": \[/,/\]/p' "lint-$kind.json" | grep -v '"errors"' | grep -o '"[^"]*"' | tr -d '"' || true)"
            if [ -z "$errors" ]; then
              echo "::error::flatpak-builder-lint $kind exited $status without a readable error list."
              failed=1
              continue
            fi
            for e in $errors; do
              case "$ACCEPTED" in
                *" $e "*) echo "accepted: $e" ;;
                *) echo "::error::flatpak-builder-lint $kind: $e (https://docs.flathub.org/linter)"; failed=1 ;;
              esac
            done
          done
          exit "$failed"

      # TODO(pin): replace @v4 with the full commit SHA: gh api repos/actions/upload-artifact/commits/v4 --jq .sha
      - uses: actions/upload-artifact@v4 # v4
        with:
          name: flathub-submission-${{ needs.build.outputs.version }}
          path: flatpak/rendered/
