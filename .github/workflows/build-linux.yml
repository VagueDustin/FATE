# Linux packages — AppImage (any distro), .deb (Ubuntu/Debian) and .rpm (Fedora/RHEL/openSUSE) —
# built on a real Linux runner and attached to the GitHub release for the tag.
#
# Release flow, end to end:
#   1. The maintainer builds the Windows installer locally and runs
#        gh release create vX.Y.Z FATE-Setup-X.Y.Z.exe latest.yml --title ... --notes ...
#      which creates the vX.Y.Z tag on GitHub — and that tag push is what triggers this workflow.
#   2. This job builds FATE-X.Y.Z-x86_64.AppImage, FATE-X.Y.Z-amd64.deb, FATE-X.Y.Z-x86_64.rpm
#      and latest-linux.yml (electron-updater's manifest for the AppImage) and uploads them to
#      that same release. If the tag was pushed before a release exists, the job creates the
#      release as a DRAFT so nothing goes public without the maintainer.
#
# "Run workflow" (workflow_dispatch) on a branch builds the packages and attaches them to the run
# as artifacts. Give it a `release_tag` to ALSO upload them to that existing release — the
# recovery path when a tag's own run failed (e.g. v1.13.0's run failed on `npm ci` because the
# lockfile at the tag was out of sync; the fix landed on main, and the fixed main was built and
# attached to v1.13.0 this way rather than rewriting the tag).
name: Build Linux

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach the packages to (empty = run artifacts only)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The .deb and .rpm are assembled by fpm, which electron-builder downloads itself — but the
      # rpm output shells out to `rpmbuild`, which Ubuntu does not ship by default. appstream and
      # desktop-file-utils bring the validators for the metadata that makes FATE show up as a real
      # application (software centres, app menu, "Open with").
      - name: Install rpmbuild and the AppStream / desktop-entry validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm appstream desktop-file-utils

      # The AppStream file is what GNOME Software / KDE Discover read. Fail early if it is wrong.
      - name: Validate the AppStream metadata
        run: appstreamcli validate --no-net --explain build/com.vaguedustin.fate.metainfo.xml

      - run: npm ci

      # build/ is gitignored (except installer.nsh): the icon set the Linux packages need is
      # derived from the tracked masters in brand/.
      - run: npm run icons

      - run: npm run lint

      # Never let electron-builder publish on its own; the release step below owns that.
      - run: npm run electron:build:linux -- --publish never

      - name: Check the packages and their desktop integration
        run: |
          set -euo pipefail
          ls -la dist-electron/*.AppImage dist-electron/*.deb dist-electron/*.rpm dist-electron/latest-linux.yml
          echo "--- rpm metadata"
          rpm -qip dist-electron/*.rpm
          echo "--- rpm dependencies"
          rpm -qpR dist-electron/*.rpm
          echo "--- deb metadata"
          dpkg-deb --info dist-electron/*.deb

          # Everything a package installs OUTSIDE /opt is desktop integration: the .desktop entry,
          # the icon set, the shared-mime-info globs and the AppStream metadata. List it, then
          # validate the desktop entry the way the distro's own tooling would.
          echo "--- deb: files outside /opt"
          dpkg-deb --contents dist-electron/*.deb | awk '{print $6}' | grep -v '^\./opt/' | grep -v '/$'
          echo "--- rpm: files outside /opt"
          rpm -qpl dist-electron/*.rpm | grep -v '^/opt/'
          rpm -qpl dist-electron/*.rpm | grep -q '^/usr/share/metainfo/com.vaguedustin.fate.metainfo.xml$'
          rpm -qpl dist-electron/*.rpm | grep -q '^/usr/share/applications/FATE.desktop$'

          echo "--- desktop entry"
          rm -rf /tmp/deb && mkdir -p /tmp/deb && dpkg-deb -x dist-electron/*.deb /tmp/deb
          desktop-file-validate /tmp/deb/usr/share/applications/FATE.desktop
          cat /tmp/deb/usr/share/applications/FATE.desktop
          echo "--- MIME types declared: $(grep '^MimeType=' /tmp/deb/usr/share/applications/FATE.desktop | tr ';' '\n' | grep -c /)"

      - uses: actions/upload-artifact@v4
        with:
          name: FATE-linux-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.rpm
            dist-electron/latest-linux.yml

      - name: Attach the packages to the GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "No release for $TAG yet — creating it as a draft."
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" \
              --notes "Linux packages built by GitHub Actions. The Windows installer and latest.yml are attached by the maintainer."
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist-electron/*.AppImage dist-electron/*.deb dist-electron/*.rpm dist-electron/latest-linux.yml
          echo "Release assets now:"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
