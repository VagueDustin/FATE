name: Feature request
description: Suggest something FATE should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        FATE is a text and code editor with a built-in Markdown preview, and it is deliberately
        offline. Requests that fit that shape have the best odds: editing features, file type and
        language support, Markdown rendering, printing, themes and platform integration.

        If you'd like to build it yourself, say so below. PRs are welcome, and CONTRIBUTING.md
        explains the setup.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Code and text editing
        - Tabs, split view, diff or navigation
        - Markdown preview or rendering
        - Printing and PDF export
        - Themes, fonts or appearance
        - Windows integration
        - Linux packaging or integration
        - Something else
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you're in, not the solution you have in mind. That comes next.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like FATE to do?
    validations:
      required: true

  - type: dropdown
    id: offer
    attributes:
      label: Would you want to implement it?
      description: No obligation either way. It just helps with planning.
      options:
        - "I'd like to open a PR for this"
        - "I'd rather someone else built it"
        - "Not sure yet"
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Mockups, how other editors (Notepad++, VS Code, Sublime Text and so on) handle it, links.
    validations:
      required: false
