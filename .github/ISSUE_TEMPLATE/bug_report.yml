name: Bug report
description: Something in FATE is broken or behaving wrongly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If this is a **security** issue, please don't file it publicly. Use
        GitHub's private vulnerability reporting on this repository instead.

  - type: input
    id: version
    attributes:
      label: FATE version
      description: Settings → About, or the status bar at the bottom of the window.
      placeholder: "1.13.3"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: "Windows: run `winver` if you're not sure. Linux: distribution, version, and how you installed FATE (AppImage, .deb, .rpm, apt or dnf repository, Snap)."
      placeholder: "Windows 11 Pro 24H2 · Ubuntu 24.04 (Snap)"
    validations:
      required: true

  - type: dropdown
    id: theme
    attributes:
      label: Theme in use
      description: Some issues only appear in one theme.
      options:
        - FATE (Navy & Gold)
        - Crimson (Classic)
        - Light
        - Dracula
        - Nord
        - Gruvbox
        - One Dark
        - Rosé Pine
        - Custom (theme builder)
        - Not theme-related / not sure
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what did FATE do?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: sample
    attributes:
      label: Sample document or file
      description: |
        For anything about editing, highlighting, saving or reloading a file, or about Markdown
        rendering (maths, diagrams, tables, images, headings), a sample file is by far the most
        useful thing you can attach. Paste the relevant part, or drag the file in.
      render: markdown
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, window size when it happened, whether it's reproducible.
    validations:
      required: false
